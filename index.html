    .part-label { font-size:11px; color:var(--muted); margin-right:10px; font-weight:400; }
    .part-line { margin-top:9px; }

    .saving { color:var(--green); font-size:12px; margin-top:3px; }

    const selectionState = Object.create(null);
    const searchInput = document.querySelector('#searchInput');
    const categoryButtons = Array.from(document.querySelectorAll('.category-button'));
    const resetButton = document.querySelector('#resetButton');
    const productList = document.querySelector('#productList');
    const resultCount = document.querySelector('#resultCount');
    let activeCategory = '全部';
    let activeProductId = null;
    const configurationDialog = document.querySelector('#configurationDialog');
    const dialogControls = document.querySelector('#dialogControls');
    const dialogQuote = document.querySelector('#dialogQuote');

    const formatMoney = (value) => 'NT$' + Number(value).toLocaleString('zh-TW');
    const escapeHtml = (value) => String(value).replace(/[&<>'"]/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[character]);

    function getControlOptions(product, control, state) {
      const values = typeof control.options === 'function' ? control.options(state) : control.options;
      return values || [];
    }

    function getSelectedState(product) {
      const saved = selectionState[product.id] || {};
      const state = {};
      product.controls.forEach((control) => {
        const options = getControlOptions(product, control, state);
        const preferred = saved[control.key] || product.defaults[control.key];
        const isValid = options.some((option) => option.value === String(preferred));
        state[control.key] = isValid ? String(preferred) : (options[0] ? options[0].value : '');
      });
      return state;
    }

    function getVariant(product, state) {
      const variant = product.getVariant(state);
      return Object.assign({}, variant, {
        configuration: variant.configuration || variant.detail,
        retailUrl: product.retailUrl,
        educationUrl: product.eduUrl
      });
    }

    function renderControls(product, state, variant) {
      if (!product.controls.length) return '<span class="config-static">' + escapeHtml(variant.detail) + '</span>';
      const fields = product.controls.map((control) => {
        const options = getControlOptions(product, control, state);
        const optionHtml = options.map((option) => '<option value="' + escapeHtml(option.value) + '"' + (option.value === state[control.key] ? ' selected' : '') + '>' + escapeHtml(option.label) + '</option>').join('');
        return '<label class="config-field config-field--' + escapeHtml(control.key) + '"><span>' + escapeHtml(control.label) + '</span><select data-product-id="' + escapeHtml(product.id) + '" data-key="' + escapeHtml(control.key) + '">' + optionHtml + '</select></label>';
      }).join('');
      return '<div class="config-grid">' + fields + '</div><span class="variant-line">' + escapeHtml(variant.detail) + '</span>';
    }

    function prices(variant) {
      const difference = variant.retail - variant.education;
      return '<div class="price-block"><div class="education-price"><span>教育價</span><strong>' + formatMoney(variant.education) + '</strong></div><div class="price">一般價 ' + formatMoney(variant.retail) + '</div><div class="saving' + (difference === 0 ? ' is-zero' : '') + '">' + (difference === 0 ? '價差：同價' : '省下 ' + formatMoney(difference)) + '</div></div>';
    }

    function partNumber(variant) {
      return '<div class="part-line"><span class="part-label">完整料號</span><span class="part-number' + (variant.partNumber === UNKNOWN_PART_NUMBER ? ' is-pending' : '') + '">' + escapeHtml(variant.partNumber) + '</span></div>';
    }

    function officialLinks(product) {
      return '<nav class="official-links" aria-label="' + escapeHtml(product.name) + ' 官方商店"><a href="' + escapeHtml(product.eduUrl) + '" target="_blank" rel="noreferrer">教育商店</a><a href="' + escapeHtml(product.retailUrl) + '" target="_blank" rel="noreferrer">一般商店</a></nav>';
    }

    function render() {
      const query = searchInput.value.trim().toLowerCase();
      const visible = products.filter((product) => {
        const state = getSelectedState(product);
        const variant = getVariant(product, state);
        const optionText = product.controls.map((control) => getControlOptions(product, control, state).map((option) => option.label).join(' ')).join(' ');
        const searchable = [product.category, product.name, product.search, variant.detail, variant.partNumber, (product.partNumbers || []).join(' '), optionText].join(' ').toLowerCase();
        return (!query || searchable.includes(query)) && (activeCategory === '全部' || product.category === activeCategory);
      });
      resultCount.innerHTML = '顯示 <strong>' + visible.length + '</strong> 款產品';
      productList.innerHTML = visible.length ? visible.map((product) => {
        const variant = getVariant(product, getSelectedState(product));
        return '<article class="product-row" data-product-id="' + escapeHtml(product.id) + '" aria-label="' + escapeHtml(product.name) + '"><div class="product-info"><div class="product-heading"><h2 class="product-name"><button type="button" class="product-trigger" aria-label="' + escapeHtml(product.name) + '，設定規格" aria-haspopup="dialog" aria-controls="configurationDialog">' + escapeHtml(product.name) + '</button></h2><span class="category">' + escapeHtml(product.category) + '</span></div><div class="summary-text">' + escapeHtml(variant.detail) + '</div>' + partNumber(variant) + '</div>' + prices(variant) + officialLinks(product) + '</article>';
      }).join('') : '<div class="empty"><strong>找不到符合條件的產品</strong>請調整搜尋文字或產品類別。</div>';
    }

    function renderDialog() {
      const product = products.find((item) => item.id === activeProductId);
      if (!product) return;
      const state = getSelectedState(product);
      const variant = getVariant(product, state);
      const focusedKey = dialogControls.contains(document.activeElement) ? document.activeElement.dataset.key : null;
      const scrollTop = dialogControls.scrollTop;
      document.querySelector('#dialogTitle').textContent = product.name;
      dialogControls.innerHTML = renderControls(product, state, variant);
      dialogQuote.innerHTML = '<h3 class="quote-label">目前配置</h3><p class="quote-config">' + escapeHtml(variant.detail) + '</p>' + partNumber(variant) + prices(variant) + officialLinks(product);
      if (focusedKey) dialogControls.querySelector('[data-key="' + CSS.escape(focusedKey) + '"]')?.focus({ preventScroll: true });
      dialogControls.scrollTop = scrollTop;
    }

    function openProduct(productId) {
      activeProductId = productId;
      renderDialog();
      dialogControls.scrollTop = 0;
      dialogQuote.scrollTop = 0;
      configurationDialog.showModal();
      document.body.classList.add('modal-open');
    }

    function setActiveCategory(category) {
      activeCategory = category;
      categoryButtons.forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.category === category)));
    }

    function reset() {
      searchInput.value = '';
      setActiveCategory('全部');
      Object.keys(selectionState).forEach((key) => delete selectionState[key]);
      render();
      searchInput.focus();
    }

    dialogControls.addEventListener('change', (event) => {
      const select = event.target.closest('select[data-product-id]');
      if (!select) return;
      const productId = select.dataset.productId;
      selectionState[productId] = Object.assign({}, selectionState[productId] || {}, { [select.dataset.key]: select.value });
      renderDialog();
      render();
    });
    document.querySelector('#closeDialog').addEventListener('click', () => configurationDialog.close());
    configurationDialog.addEventListener('keydown', (event) => {
      if (event.key !== 'Tab') return;
      const focusable = Array.from(configurationDialog.querySelectorAll('button, select, a[href]')).filter((element) => !element.disabled && element.getClientRects().length);
      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    });
    let backdropPressed = false;
    const outsideDialog = (event) => {
      const rect = configurationDialog.getBoundingClientRect();
      return event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom;
    };
    configurationDialog.addEventListener('pointerdown', (event) => { backdropPressed = event.target === configurationDialog && outsideDialog(event); });
    configurationDialog.addEventListener('click', (event) => {
      if (backdropPressed && event.target === configurationDialog && outsideDialog(event)) configurationDialog.close();
      backdropPressed = false;
    });
    configurationDialog.addEventListener('close', () => {
      document.body.classList.remove('modal-open');
      const row = productList.querySelector('[data-product-id="' + CSS.escape(activeProductId || '') + '"]');
      activeProductId = null;
      (row?.querySelector('.product-trigger') || searchInput).focus({ preventScroll: true });
    });
    productList.addEventListener('click', (event) => {
      if (event.target.closest('a')) return;
      const row = event.target.closest('.product-row');
      if (row) openProduct(row.dataset.productId);
    });
    searchInput.addEventListener('input', render);
    categoryButtons.forEach((button) => button.addEventListener('click', () => {
      setActiveCategory(button.dataset.category);
      render();
    }));
    resetButton.addEventListener('click', reset);

    setActiveCategory('全部');
    render();
  </script>
